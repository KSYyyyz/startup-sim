name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: python -m ruff check .

      - name: Black check
        run: python -m black --check --line-length 100 --target-version py311 .

      - name: isort check
        run: python -m isort --check-only --profile black --line-length 100 .

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: CSharp core tests
        run: dotnet test csharp/StartupSim.Core.Tests/StartupSim.Core.Tests.csproj --configuration Release

      - name: Godot CSharp project build
        run: dotnet build godot/StartupSimGodot/StartupSimGodot.csproj --configuration Debug

      - name: Pytest
        run: python -m pytest tests/ -v

      - name: Playtest
        run: python scripts/playtest.py

      - name: Docs consistency check
        run: python scripts/check_docs_consistency.py
